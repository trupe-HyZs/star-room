<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Lapiseira lavanda</title><desc id="desc">Lapiseira elegante em tons de lavanda, grafite e prata, com detalhes metálicos e sombra suave.</desc>
<defs>
 <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8ccef"/><stop offset=".17" stop-color="#a894d2"/><stop offset=".43" stop-color="#8873b8"/><stop offset=".65" stop-color="#6f5b9c"/><stop offset=".84" stop-color="#9e8ac7"/><stop offset="1" stop-color="#d7c9ee"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#aaa7b5"/><stop offset=".24" stop-color="#fff"/><stop offset=".48" stop-color="#d4d0dc"/><stop offset=".7" stop-color="#85818f"/><stop offset="1" stop-color="#f4f1fa"/></linearGradient>
 <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#51416f"/><stop offset=".25" stop-color="#8772b1"/><stop offset=".5" stop-color="#b7a6dd"/><stop offset=".75" stop-color="#7864a5"/><stop offset="1" stop-color="#51416f"/></linearGradient>
 <filter id="shadow" x="-30%" y="-80%" width="160%" height="280%"><feGaussianBlur stdDeviation="9"/></filter>
 <filter id="glow" x="-40%" y="-60%" width="180%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
