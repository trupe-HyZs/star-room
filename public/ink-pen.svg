<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Caneta-tinteiro premium</title>
<desc id="desc">Caneta-tinteiro preta brilhante com detalhes dourados, ponta metálica e sombra suave, inclinada na diagonal.</desc>
<defs>
  <linearGradient id="lacquer" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#565a62"/><stop offset=".12" stop-color="#171a20"/><stop offset=".3" stop-color="#343840"/><stop offset=".48" stop-color="#080a0e"/><stop offset=".68" stop-color="#20232a"/><stop offset=".84" stop-color="#090b10"/><stop offset="1" stop-color="#454953"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#6e461b"/><stop offset=".18" stop-color="#d8ad5a"/><stop offset=".38" stop-color="#fff0b1"/><stop offset=".56" stop-color="#b98232"/><stop offset=".76" stop-color="#f2d48a"/><stop offset="1" stop-color="#6f481e"/>
  </linearGradient>
  <linearGradient id="nib" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#fff0bd"/><stop offset=".22" stop-color="#b88a43"/><stop offset=".48" stop-color="#f4d88f"/><stop offset=".72" stop-color="#765024"/><stop offset="1" stop-color="#e4bd70"/>
  </linearGradient>
  <linearGradient id="clip" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#8c632a"/><stop offset=".35" stop-color="#ffe6a0"/><stop offset=".58" stop-color="#b78638"/><stop offset=".82" stop-color="#f8d987"/><stop offset="1" stop-color="#70491f"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-80%" width="160%" height="280%"><feGaussianBlur stdDeviation="9"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<ellipse cx="285" cy="218" rx="202" ry="19" fill="#000" opacity=".62" filter="url(#shadow)" transform="rotate(-25 285 218)"/>
<ellipse cx="287" cy="211" rx="166" ry="5" fill="#83bfff" opacity=".12" filter="url(#glow)" transform="rotate(-25 287 211)"/>
